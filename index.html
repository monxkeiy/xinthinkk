<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading Memories</title>
<style>
  :root{
    --tint: #ff2d78;
    --tint-2: #ff5f6d;
    --bg: #050203;
    --card-bg: #1a1114;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    width:100%; height:100%;
    background: var(--bg);
    overflow:hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  .phone{
    position:relative;
    width:100%;
    height:100vh;
    background: radial-gradient(ellipse at 50% 30%, rgba(255,45,120,0.12), transparent 60%), var(--bg);
    overflow:hidden;
  }

  /* ---------- bottom-right music button ---------- */
  .music-btn{
    position:absolute;
    bottom:22px; right:18px;
    width:44px; height:44px;
    border-radius:50%;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.15);
    display:flex; align-items:center; justify-content:center;
    z-index:50;
    color: var(--tint);
    font-size:18px;
    cursor:pointer;
    transition: transform .2s ease;
  }
  .music-btn:active{ transform: scale(0.9); }

  /* ================= INTRO / LOADING SCREEN ================= */
  .intro{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:100;
    transition: opacity 1s ease;
  }
  .intro.hide{ opacity:0; pointer-events:none; }

  .heart{
    width:64px; height:64px;
    margin-bottom:28px;
    filter: drop-shadow(0 0 18px var(--tint));
    animation: pulse 1.1s ease-in-out infinite;
  }
  .heart svg{ width:100%; height:100%; fill: var(--tint); }

  @keyframes pulse{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.15); }
  }

  .loading-text{
    font-size: 15px;
    letter-spacing: 8px;
    color: var(--tint);
    text-shadow: 0 0 12px rgba(255,45,120,0.7);
    margin-bottom: 18px;
    font-weight:300;
  }

  .progress-track{
    width: 220px;
    height: 2px;
    background: rgba(255,255,255,0.12);
    margin-bottom: 14px;
    position:relative;
    overflow:hidden;
  }
  .progress-fill{
    position:absolute; left:0; top:0; height:100%;
    width:0%;
    background: var(--tint);
    box-shadow: 0 0 10px var(--tint);
    animation: fill 2.6s ease forwards;
  }
  @keyframes fill{ to{ width:100%; } }

  .dots{ display:flex; gap:8px; }
  .dots span{
    width:6px; height:6px; border-radius:50%;
    background: rgba(255,45,120,0.3);
    animation: dotPulse 1.4s ease-in-out infinite;
  }
  .dots span:nth-child(1){ animation-delay: 0s; }
  .dots span:nth-child(2){ animation-delay: .2s; }
  .dots span:nth-child(3){ animation-delay: .4s; }
  @keyframes dotPulse{
    0%,100%{ background: rgba(255,45,120,0.3); transform:scale(1); }
    50%{ background: var(--tint); transform:scale(1.3); }
  }

  /* ================= MAIN SCENE ================= */
  .scene{
    position:absolute; inset:0;
    opacity:0;
    transition: opacity 1.4s ease;
    filter: hue-rotate(0deg);
    animation: tintCycle 14s linear infinite;
  }
  .scene.show{ opacity:1; }

  @keyframes tintCycle{
    0%   { filter: hue-rotate(0deg); }
    35%  { filter: hue-rotate(-25deg); }
    65%  { filter: hue-rotate(140deg); }
    100% { filter: hue-rotate(0deg); }
  }

  .float-word{
    position:absolute;
    white-space:nowrap;
    color: rgba(255,255,255,0.55);
    font-weight:300;
    letter-spacing:1px;
    text-shadow: 0 0 10px rgba(255,45,120,0.35);
    animation-name: drift;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  .float-card{
    position:absolute;
    width:112px; height:132px;
    border-radius:16px;
    background: linear-gradient(150deg, #3a2028, #150a0d);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    animation-name: drift;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    overflow:hidden;
  }
  .float-card::before{
    content:'';
    position:absolute; inset:0;
    background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.18), transparent 60%);
    z-index:2;
    pointer-events:none;
  }
  .float-card img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }

  @keyframes drift{
    0%   { transform: translateY(110vh) translateX(0) rotate(0deg); opacity:0; }
    8%   { opacity:1; }
    92%  { opacity:1; }
    100% { transform: translateY(-25vh) translateX(var(--dx,0px)) rotate(var(--rot,0deg)); opacity:0; }
  }

  .vignette{
    position:absolute; inset:0;
    pointer-events:none;
    background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.65) 100%);
    z-index:5;
  }
</style>
</head>
<body>

<div class="phone">

  <div class="music-btn" id="musicBtn">&#9835;</div>
  <audio id="bgSound" src="sound.mp3" loop preload="auto"></audio>

  <!-- Intro loading screen -->
  <div class="intro" id="intro">
    <div class="heart">
      <svg viewBox="0 0 32 29"><path d="M16 29 2.7 16.3C-1.8 11.9.2 4.4 6.4 2.6 10 1.6 13.8 2.9 16 6c2.2-3.1 6-4.4 9.6-3.4 6.2 1.8 8.2 9.3 3.7 13.7L16 29Z"/></svg>
    </div>
    <div class="loading-text">LOADING MEMORIES</div>
    <div class="progress-track"><div class="progress-fill"></div></div>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>

  <!-- Main animated scene -->
  <div class="scene" id="scene"></div>
  <div class="vignette"></div>

</div>

<script>
  const words = [
    "stay with me", "forever", "i love you", "only you", "i miss you",
    "you mean everything", "always with you", "my safe place",
    "my favorite person", "always on my mind", "love u more",
    "thinking of u", "you are enough"
  ];

  const photos = ['foto1.jpg', 'foto2.jpg', 'foto3.jpg'];
  const scene = document.getElementById('scene');
  const W = window.innerWidth;

  // center column: words & cards spawn within a band around the middle
  // of the screen instead of edge-to-edge, for a more intimate feel.
  const centerX = W / 2;

  function rand(min, max){ return Math.random() * (max - min) + min; }

  function spawnWord(){
    const el = document.createElement('div');
    el.className = 'float-word';
    el.textContent = words[Math.floor(Math.random() * words.length)];
    const size = rand(14, 24);
    el.style.fontSize = size + 'px';
    // keep within a centered band (roughly middle 60% of width)
    const bandHalf = Math.min(W * 0.32, 150);
    const left = centerX + rand(-bandHalf, bandHalf) - 60;
    el.style.left = Math.max(8, Math.min(W - 160, left)) + 'px';
    el.style.textAlign = 'center';
    const duration = rand(9, 16);
    el.style.animationDuration = duration + 's';
    el.style.setProperty('--dx', rand(-20, 20) + 'px');
    el.style.setProperty('--rot', rand(-4, 4) + 'deg');
    scene.appendChild(el);
    setTimeout(() => el.remove(), duration * 1000 + 200);
  }

  function spawnCard(){
    const el = document.createElement('div');
    el.className = 'float-card';
    const img = document.createElement('img');
    img.src = photos[Math.floor(Math.random() * photos.length)];
    img.alt = 'memory';
    el.appendChild(img);
    const bandHalf = Math.min(W * 0.28, 130);
    const left = centerX + rand(-bandHalf, bandHalf) - 56;
    el.style.left = Math.max(8, Math.min(W - 120, left)) + 'px';
    const duration = rand(12, 19);
    el.style.animationDuration = duration + 's';
    el.style.setProperty('--dx', rand(-15, 15) + 'px');
    el.style.setProperty('--rot', rand(-5, 5) + 'deg');
    scene.appendChild(el);
    setTimeout(() => el.remove(), duration * 1000 + 200);
  }

  let running = true;
  let wordInterval, cardInterval;

  function startScene(){
    document.getElementById('scene').classList.add('show');
    // seed initial batch so it doesn't feel empty
    for(let i=0;i<6;i++) setTimeout(spawnWord, i*300);
    for(let i=0;i<3;i++) setTimeout(spawnCard, i*500);

    wordInterval = setInterval(spawnWord, 900);
    cardInterval = setInterval(spawnCard, 1800);
  }

  const bgSound = document.getElementById('bgSound');

  // Intro timing
  setTimeout(() => {
    document.getElementById('intro').classList.add('hide');
    startScene();
    // try autoplay; browsers may block this until a user interacts
    bgSound.volume = 0.7;
    bgSound.play().then(() => {
      musicBtn.classList.add('playing');
    }).catch(() => {
      // autoplay blocked, wait for user tap on the music button
    });
  }, 2800);

  // music button toggles the background sound on/off
  const musicBtn = document.getElementById('musicBtn');
  musicBtn.addEventListener('click', () => {
    if (bgSound.paused){
      bgSound.play();
      musicBtn.classList.add('playing');
      musicBtn.style.opacity = '1';
    } else {
      bgSound.pause();
      musicBtn.classList.remove('playing');
      musicBtn.style.opacity = '0.4';
    }
  });
</script>

</body>
</html>
